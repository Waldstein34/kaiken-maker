<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<meta name="description" content="文字を入れ替えて「最後だけ垂直に伸びるグラフ」や手配書のパロディ画像を作れます。">
<meta property="og:type" content="website">
<meta property="og:title" content="他責会見メーカー">
<meta property="og:description" content="〇〇の発展が原因であります。文字を入れ替えてパロディ画像を作れます。">
<meta property="og:url" content="https://waldstein34.github.io/kaiken-maker/">
<meta property="og:image" content="https://waldstein34.github.io/kaiken-maker/ogp.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="他責会見メーカー">
<meta name="twitter:image" content="https://waldstein34.github.io/kaiken-maker/ogp.png">
<script data-goatcounter="https://kaiken-count.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<title>他責会見メーカー</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Noto+Serif+JP:wght@900&family=Anton&display=swap">
<style>
/* 上から タイトル帯 → タブ → リボン → スライド → 状態バー。スライドの文字を直接タップして編集 */
:root{
  --brand:#b7472a; --brand-fg:#ffffff; --brand-dark:#8e3720;
  --chrome:#f3f2f1; --ribbon:#ffffff; --line:#d6d4d2; --fg:#252423; --muted:#605e5c;
  --work:#e1dfdd; --select:#2b6fd6; --btn-hover:#e8e6e4;
  --ui:"Noto Sans JP","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --chrome:#292827; --ribbon:#1f1e1d; --line:#3b3a39; --fg:#f3f2f1; --muted:#b3b0ad;
  --work:#121110; --select:#6aa1ff; --btn-hover:#353433; color-scheme:dark}}
:root[data-theme="dark"]{
  --chrome:#292827; --ribbon:#1f1e1d; --line:#3b3a39; --fg:#f3f2f1; --muted:#b3b0ad;
  --work:#121110; --select:#6aa1ff; --btn-hover:#353433; color-scheme:dark}
html,body{height:100%}
body{background:var(--work);color:var(--fg);font-family:var(--ui);font-size:13px;display:flex;flex-direction:column;overflow:hidden}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.titlebar{background:var(--brand);color:var(--brand-fg);padding-block:6px;display:flex;align-items:center;gap:10px}
.titlebar .file{font-weight:700;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.qa{font:inherit;font-size:18px;line-height:1;width:32px;height:28px;border:0;border-radius:4px;background:transparent;color:var(--brand-fg);cursor:pointer;flex:none}
.qa:hover{background:var(--brand-dark)}
.qa:disabled{opacity:.4;cursor:default;background:transparent}
.qa:focus-visible{outline:2px solid var(--brand-fg);outline-offset:1px}
.titlebar .file{display:flex;align-items:center;gap:2px}
#fileName{font:inherit;font-weight:700;color:inherit;background:transparent;border:1px solid transparent;border-radius:3px;padding:2px 4px;min-width:3em;max-width:100%;field-sizing:content;text-overflow:ellipsis}
#fileName:hover{border-color:rgba(255,255,255,.55)}
#fileName:focus{background:#ffffff;color:#252423;outline:none;border-color:#ffffff}
.titlebar .state{flex:none;opacity:.85}
.qa.save{width:auto;font-size:12.5px;font-weight:700;padding:0 10px;border:1px solid rgba(255,255,255,.65)}
.toast{position:fixed;left:50%;bottom:calc(44px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#252423;color:#ffffff;padding:8px 16px;border-radius:4px;z-index:30;font-size:13px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.bs-row{display:flex;align-items:center;gap:6px}
.bs-row .bs-file{flex:1;min-width:0}
.bs-del{font:inherit;font-size:12px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:4px;padding:5px 9px;cursor:pointer;flex:none;white-space:nowrap}
.bs-del.armed{background:#c0392b;border-color:#c0392b;color:#ffffff}
.titlebar .saved{font-size:11px;opacity:.85;white-space:nowrap}

.tabs{background:var(--brand);display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;font:inherit;font-size:12.5px;border:0;background:transparent;color:var(--brand-fg);padding:6px 11px;border-radius:4px 4px 0 0;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ribbon);color:var(--brand);font-weight:700}
.tabs button.file-tab{background:var(--brand-dark)}

.ribbon{background:var(--ribbon);border-bottom:1px solid var(--line);padding-block:6px;display:flex;gap:6px;align-items:stretch;overflow-x:auto;scrollbar-width:thin}
.group{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding-right:8px;border-right:1px solid var(--line)}
.group:last-child{border-right:0}
.group .row{display:flex;gap:3px;align-items:center}
.group .cap{font-size:10px;color:var(--muted)}
.rb{font:inherit;font-size:13px;min-width:30px;height:30px;padding:0 6px;border:1px solid transparent;border-radius:4px;background:transparent;color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.rb:hover{background:var(--btn-hover)}
.rb[aria-pressed="true"]{background:var(--btn-hover);border-color:var(--line)}
.rb:focus-visible,.tabs button:focus-visible{outline:2px solid var(--select);outline-offset:1px}
.rb.big{flex-direction:column;height:auto;padding:2px 8px;font-size:11px;gap:0}
.rb.big .ic{font-size:18px;line-height:1.2}
.rb.export{background:var(--brand);color:var(--brand-fg);font-weight:700}
.rb.export:hover{background:var(--brand-dark)}
.sw{width:20px;height:20px;border-radius:3px;border:1px solid var(--line);cursor:pointer;padding:0}
.size{min-width:34px;text-align:center;font-variant-numeric:tabular-nums;border:1px solid var(--line);border-radius:3px;padding:3px 2px;font-size:12px}

.work{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-start;gap:8px;padding-block:10px;overflow:auto}
.slidebox{flex:none;position:relative;width:100%;max-width:1100px;margin:0 auto;aspect-ratio:16/9;box-shadow:0 1px 4px rgba(0,0,0,.35);background:#ffffff;overflow:hidden}
.stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0}
.stage canvas{position:absolute;inset:0;width:1600px;height:900px}
.tx{position:absolute;transform:translate(-50%,-50%);white-space:pre;text-align:center;line-height:1.2;
  font-family:"Noto Sans JP","Hiragino Sans",sans-serif;outline:none;cursor:text;padding:4px 10px;border:3px dashed transparent;min-width:40px;min-height:1.2em}
.tx.sel{border-color:var(--select)}
.pic{position:absolute;transform:translate(-50%,-50%);border:3px dashed transparent;cursor:pointer;max-width:none}
.pic.sel{border-color:var(--select)}
.rb:disabled{opacity:.4;cursor:default}
.tx.gold{background:linear-gradient(180deg,#fff6c4 0%,#f1cf5c 38%,#a8770f 52%,#e8c25a 70%,#fff0a8 100%);-webkit-background-clip:text;background-clip:text;color:transparent!important;caret-color:#000}
.tx.pill{background:#3f5fae;padding:10px 24px}
.tx.cap{text-shadow:0 0 6px #000,3px 3px 0 #000,-3px -3px 0 #000,3px -3px 0 #000,-3px 3px 0 #000,0 4px 0 #000,0 -4px 0 #000,4px 0 0 #000,-4px 0 0 #000}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px;width:100%;max-width:1100px;margin:0 auto;background:var(--ribbon);border:1px solid var(--line);border-radius:6px;padding:10px;box-sizing:border-box;flex:none}
.fld{display:grid;gap:2px;min-width:0}
.fld.wide{grid-column:1/-1}
.frow{display:flex;gap:6px;min-width:0}
.frow input{flex:1}
.fbtn{font:inherit;font-size:12.5px;padding:0 9px;border:1px solid var(--line);border-radius:4px;background:var(--ribbon);color:var(--fg);cursor:pointer;flex:none;white-space:nowrap}
.fbtn:focus-visible{outline:2px solid var(--select);outline-offset:1px}
.fld label{font-size:11px;font-weight:700;letter-spacing:.03em;color:var(--muted)}
.fld input{font:inherit;font-size:16px;padding:5px 8px;border:1px solid var(--line);border-radius:4px;background:var(--chrome);color:var(--fg);width:100%;box-sizing:border-box;min-width:0}
.fld input:focus{outline:2px solid var(--select);outline-offset:0}
.fld.on label{color:var(--select)}
.fld.on input{border-color:var(--select)}
.hint{text-align:center;font-size:11.5px;color:var(--muted);margin:0}

.status{background:var(--chrome);border-top:1px solid var(--line);padding-block:4px;display:flex;gap:14px;font-size:11px;color:var(--muted);align-items:center}
.status .grow{flex:1}
.status b{font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums}
#typeMeter.suspect,#typeMeter.suspect b{color:#c0392b;font-weight:700}
.status{overflow-x:auto;white-space:nowrap}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:20;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal img{max-width:100%;max-height:70vh;border-radius:4px;box-shadow:0 4px 18px rgba(0,0,0,.5)}
.modal p{color:#ffffff;margin:0;font-size:13px}
.share-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.modal .share-main{background:#000000;color:#ffffff}
.modal button{font:inherit;font-weight:700;padding:8px 22px;border-radius:4px;border:0;background:#ffffff;color:#252423;cursor:pointer}
@media (prefers-reduced-motion:no-preference){.tx{transition:border-color .12s}}
#cropModal{background:rgba(0,0,0,.92)}
#cropCv{max-width:100%;touch-action:none;border-radius:4px;background:#000000;cursor:move}
.modal .crop-title{font-weight:700;font-size:15px}
.modal .crop-hint{font-size:12px;opacity:.85;max-width:34em;text-align:center}
.crop-size{color:#ffffff;font-size:13px;display:flex;gap:8px;align-items:center}
.crop-size output{font-weight:700;font-variant-numeric:tabular-nums}
#cropScale{width:min(320px,80vw)}
.crop-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.modal .crop-ok{background:#2b6fd6;color:#ffffff}

.backstage{position:fixed;inset:0;z-index:15;display:flex;background:var(--ribbon);color:var(--fg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.bs-nav{background:var(--brand);display:flex;flex-direction:column;gap:2px;padding-block:10px;width:160px;flex:none;padding-left:env(safe-area-inset-left,0px)}
.bs-back{font:inherit;font-size:20px;width:40px;height:40px;margin:0 0 8px 10px;border-radius:50%;border:1px solid rgba(255,255,255,.6);background:transparent;color:var(--brand-fg);cursor:pointer;flex:none}
.bs-item{font:inherit;font-size:14px;text-align:left;padding:10px 18px;border:0;background:transparent;color:var(--brand-fg);cursor:pointer;white-space:nowrap}
.bs-item[aria-current="true"]{background:var(--brand-dark);font-weight:700}
.bs-item:focus-visible,.bs-back:focus-visible,.bs-file:focus-visible,.bs-card:focus-visible{outline:2px solid var(--select);outline-offset:1px}
.bs-main{flex:1;min-width:0;overflow:auto;padding-block:16px;padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px))}
.bs-main h2{font-size:22px;font-weight:500;margin:0 0 10px}
.bs-sub{font-size:12px;color:var(--muted);margin:0 0 4px;border-bottom:1px solid var(--line);padding-bottom:6px}
.bs-list{display:grid;gap:2px}
.bs-file{display:flex;gap:12px;align-items:center;padding:8px;border:0;background:transparent;color:var(--fg);font:inherit;text-align:left;cursor:pointer;border-radius:4px;width:100%}
.bs-file:hover{background:var(--btn-hover)}
.bs-file canvas{width:96px;height:54px;border:1px solid var(--line);flex:none}
.bs-file .tt{display:grid;gap:2px;min-width:0}
.bs-file .nm{font-weight:700;font-size:13.5px}
.bs-file .meta{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bs-card{display:grid;gap:6px;justify-items:start;padding:8px;border:1px solid var(--line);border-radius:4px;background:transparent;color:var(--fg);font:inherit;font-size:13px;cursor:pointer}
.bs-card:hover{background:var(--btn-hover)}
.bs-cards{display:flex;flex-wrap:wrap;gap:10px}
.bs-card canvas{width:180px;max-width:100%;height:auto;aspect-ratio:16/9;border:1px solid var(--line)}
@media (max-width:560px){
  .backstage{flex-direction:column}
  .bs-nav{flex-direction:row;align-items:center;width:auto;padding-block:6px;overflow-x:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .bs-back{margin:0 6px 0 0;width:34px;height:34px;font-size:17px}
  .bs-item{padding:6px 12px}
}
</style>
</head>
<body>


<div class="titlebar pad">
  <button type="button" class="qa" id="undoBtn" aria-label="元に戻す" title="元に戻す" disabled>↶</button>
  <button type="button" class="qa" id="redoBtn" aria-label="やり直す" title="やり直す" disabled>↷</button>
  <button type="button" class="qa save" id="saveBtn" title="保存（Ctrl+S）">保存</button>
  <span class="file"><input id="fileName" value="会見ふう.pptx" size="14" aria-label="ファイル名（タップして変更）" title="タップして名前を変更" spellcheck="false" autocomplete="off"><span class="state">- 編集中</span></span>
  <span class="saved" id="saveState">未保存</span>
</div>
<div class="tabs pad" role="tablist">
  <button type="button" class="file-tab" id="fileTab">ファイル</button>
  <button type="button" role="tab" id="tab-home" aria-selected="true" data-tab="home">ホーム</button>
  <button type="button" role="tab" id="tab-insert" aria-selected="false" data-tab="insert">挿入</button>
  <button type="button" role="tab" id="tab-design" aria-selected="false" data-tab="design">デザイン</button>
  <button type="button" tabindex="-1">画面切り替え</button>
  <button type="button" tabindex="-1">アニメーション</button>
  <button type="button" tabindex="-1">校閲</button>
</div>

<div class="ribbon pad" id="rb-home">
  <div class="group">
    <div class="row">
      <button class="rb" id="sizeDown" type="button" aria-label="文字を小さく">A<sup>−</sup></button>
      <span class="size" id="sizeShow">--</span>
      <button class="rb" id="sizeUp" type="button" aria-label="文字を大きく">A<sup>+</sup></button>
      <button class="rb" id="bold" type="button" aria-pressed="false" aria-label="太字"><b>B</b></button>
    </div>
    <span class="cap">フォント</span>
  </div>
  <div class="group">
    <div class="row" id="swatches"></div>
    <span class="cap">文字の色</span>
  </div>
  <div class="group">
    <div class="row"><button class="rb big export" type="button" data-export><span class="ic">⇩</span>書き出し</button></div>
    <span class="cap">画像</span>
  </div>
</div>

<div class="ribbon pad" id="rb-insert" hidden>
  <div class="group">
    <div class="row" id="emojis"></div>
    <span class="cap">真ん中の絵文字</span>
  </div>
  <div class="group">
    <div class="row">
      <button class="rb big" type="button" id="pickImg"><span class="ic">🖼️</span>画像を選ぶ</button>
      <button class="rb big" type="button" id="editImg" disabled><span class="ic">✂️</span>切り取り・大きさ</button>
      <button class="rb big" type="button" id="clearImg" disabled><span class="ic">✕</span>画像を外す</button>
    </div>
    <span class="cap">真ん中の画像</span>
    <input type="file" id="imgFile" accept="image/*" hidden>
  </div>
  <div class="group">
    <div class="row"><button class="rb big export" type="button" data-export><span class="ic">⇩</span>書き出し</button></div>
    <span class="cap">画像</span>
  </div>
</div>

<div class="ribbon pad" id="rb-design" hidden>
  <div class="group">
    <div class="row">
      <button class="rb big" type="button" data-p="0"><span class="ic">📈</span>会見ふう</button>
      <button class="rb big" type="button" data-p="1"><span class="ic">⚖️</span>体重</button>
      <button class="rb big" type="button" data-p="2"><span class="ic">🌙</span>残業</button>
      <button class="rb big" type="button" data-p="3"><span class="ic">📱</span>スマホ</button>
      <button class="rb big" type="button" data-p="4"><span class="ic">💴</span>お金</button>
      <button class="rb big" type="button" data-p="5"><span class="ic">⌨️</span>タイピング</button>
    </div>
    <span class="cap">お手本</span>
  </div>
  <div class="group">
    <div class="row"><button class="rb big export" type="button" data-export><span class="ic">⇩</span>書き出し</button></div>
    <span class="cap">画像</span>
  </div>
</div>

<div class="work pad">
  <div class="slidebox" id="slidebox">
    <div class="stage" id="stage"><canvas id="bg" width="1600" height="900"></canvas><img class="pic" id="pic" alt="挿入した画像" hidden></div>
  </div>
  <p class="hint" id="hint">スライドをタップか、下の欄で書き換え（「/」で改行）</p>
  <div class="fields" id="fields"></div>
</div>

<div class="status pad">
  <span>スライド 1/1</span><span id="typeMeter" title="タイピング数">⌨ タイピング数 <b id="typeCount">0</b></span><span id="sand" title="命の砂時計">⏳ 命の砂時計 <b id="sandPct">100%</b></span><span class="grow"></span><span id="zoom">100%</span>
</div>

<div class="backstage" id="backstage" hidden>
  <nav class="bs-nav" aria-label="ファイルの操作">
    <button type="button" class="bs-back" id="bsBack" aria-label="編集に戻る">←</button>
    <button type="button" class="bs-item" data-bs="new" aria-current="false">新規</button>
    <button type="button" class="bs-item" data-bs="open" aria-current="true">開く</button>
    <button type="button" class="bs-item" id="bsSave">保存</button>
    <button type="button" class="bs-item" id="bsExport">書き出し</button>
  </nav>
  <section class="bs-main">
    <div id="bs-open">
      <h2>開く</h2>
      <p class="bs-sub" id="savedHead" hidden>保存したファイル（このブラウザ）</p>
      <div class="bs-list" id="savedList"></div>
      <p class="bs-sub">お手本のファイル</p>
      <div class="bs-list" id="fileList"></div>
    </div>
    <div id="bs-new" hidden>
      <h2>新規</h2>
      <div class="bs-cards">
        <button type="button" class="bs-card" id="newBlank"><canvas width="400" height="225" id="blankThumb"></canvas><span>白紙の垂直グラフ</span></button>
        <button type="button" class="bs-card" id="newWanted"><canvas width="400" height="225" id="wantedThumb"></canvas><span>白紙の手配書</span></button>
      </div>
    </div>
  </section>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<div class="modal" id="cropModal" hidden>
  <p class="crop-title">画像の切り取り・大きさ</p>
  <canvas id="cropCv" width="300" height="200"></canvas>
  <p class="crop-hint">四すみの白い四角を動かすと、切り取る範囲が変わります。枠の中を動かすと、範囲ごと移動します。</p>
  <label class="crop-size" for="cropScale">スライドでの大きさ <output id="cropScaleOut">100%</output></label>
  <input type="range" id="cropScale" min="20" max="300" step="5" value="100">
  <div class="crop-row">
    <button type="button" id="cropReset">切り取りをやめる</button>
    <button type="button" id="cropCancel">キャンセル</button>
    <button type="button" id="cropOk" class="crop-ok">決定</button>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <img id="outImg" alt="書き出したスライド画像">
  <p>画像を長押しすると保存できます</p>
  <div class="share-row">
    <button type="button" id="shareX" class="share-main">Xで共有</button>
    <button type="button" id="closeModal">閉じる</button>
  </div>
</div>

<script>
const FONT='"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif';
const ANTON='"Anton","Noto Sans JP",sans-serif';
const SERIF='"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif';

const C={ink:"#2b1d17",line:"#8a3a1f",blue:"#3f5fae",bubble:"#7a3218",wink:"#2a2118",red:"#9b1c1c"};

// 背景の図形
function arrowHead(c,x,y,dir,s,color){
  c.fillStyle=color;c.beginPath();
  if(dir==="up"){c.moveTo(x,y);c.lineTo(x-s*.7,y+s);c.lineTo(x+s*.7,y+s)}
  if(dir==="right"){c.moveTo(x,y);c.lineTo(x-s,y-s*.7);c.lineTo(x-s,y+s*.7)}
  if(dir==="left"){c.moveTo(x,y);c.lineTo(x+s,y-s*.7);c.lineTo(x+s,y+s*.7)}
  c.closePath();c.fill();
}
function dbl(c,x1,x2,y,color){c.strokeStyle=color;c.lineWidth=10;c.beginPath();c.moveTo(x1+16,y);c.lineTo(x2-16,y);c.stroke();arrowHead(c,x1,y,"left",22,color);arrowHead(c,x2,y,"right",22,color)}
function drawGraph(c){
  const g=c.createLinearGradient(0,0,0,900);g.addColorStop(0,"#f3f2fb");g.addColorStop(1,"#e2e0ef");
  c.fillStyle=g;c.fillRect(0,0,1600,900);
  const ox=430,oy=600,xEnd=1110,vx=1175;
  c.lineCap="round";c.strokeStyle=C.ink;c.lineWidth=6;
  c.beginPath();c.moveTo(ox,oy);c.lineTo(ox,180);c.stroke();arrowHead(c,ox,150,"up",28,C.ink);
  c.beginPath();c.moveTo(ox,oy);c.lineTo(xEnd+40,oy);c.stroke();
  c.strokeStyle=C.line;c.lineWidth=7;
  c.beginPath();c.moveTo(ox+8,oy-6);c.lineTo(xEnd-20,oy-22);c.quadraticCurveTo(xEnd+30,oy-40,vx,330);c.stroke();
  c.lineCap="butt";c.lineWidth=16;c.beginPath();c.moveTo(vx,340);c.lineTo(vx,150);c.stroke();c.lineCap="round";
  arrowHead(c,vx,108,"up",44,C.line);
  c.fillStyle=C.bubble;c.beginPath();c.ellipse(1325,170,130,72,0,0,Math.PI*2);c.fill();
  c.beginPath();c.moveTo(1215,200);c.lineTo(vx+30,220);c.lineTo(1245,225);c.closePath();c.fill();
  dbl(c,ox,xEnd-10,650,C.blue);dbl(c,xEnd+10,vx+40,650,C.blue);
  c.fillStyle=C.blue;c.fillRect(770-190,680,380,104);c.fillRect(1157-100,680,200,104);
}
function drawWanted(c){
  c.fillStyle="#111111";c.fillRect(0,0,1600,900);
  let sd=11;const rnd=()=>{sd=(sd*16807)%2147483647;return sd/2147483647};
  const m=24,pts=[];
  for(let x=m;x<=1600-m;x+=18)pts.push([x,m+rnd()*12]);
  for(let y=m;y<=900-m;y+=18)pts.push([1600-m-rnd()*12,y]);
  for(let x=1600-m;x>=m;x-=18)pts.push([x,900-m-rnd()*12]);
  for(let y=900-m;y>=m;y-=18)pts.push([m+rnd()*12,y]);
  const g=c.createRadialGradient(800,450,150,800,450,900);g.addColorStop(0,"#f8f8f6");g.addColorStop(1,"#d6d5cf");
  c.fillStyle=g;c.beginPath();c.moveTo(pts[0][0],pts[0][1]);pts.forEach(q=>c.lineTo(q[0],q[1]));c.closePath();c.fill();
  for(let i=0;i<420;i++){c.fillStyle=`rgba(0,0,0,${(rnd()*.12).toFixed(3)})`;c.fillRect(30+rnd()*1540,30+rnd()*840,rnd()*3+1,rnd()*3+1)}
  c.fillStyle="#0c0c0c";c.fillRect(34,408,1532,76);
  c.fillStyle="#0f1d17";c.fillRect(90,505,670,255);
  c.strokeStyle="rgba(90,210,160,.16)";c.lineWidth=2;
  for(let y=522;y<748;y+=14){c.beginPath();c.moveTo(104,y);c.lineTo(104+rnd()*360+180,y);c.stroke()}
  c.strokeStyle="#0c0c0c";c.lineWidth=5;c.strokeRect(90,505,670,255);
  c.fillStyle="#3a3a3a";c.font=`500 14px ${FONT}`;c.textAlign="center";c.textBaseline="middle";
  c.fillText("これはパロディです。実在の人物・団体・懸賞金とは関係ありません。",1180,854);
}

// 画像の切り取り・大きさ
let crop=null,cropSrc=null,cdrag=null,ck=1;
function openCrop(){
  if(!picImg)return;
  cropSrc=picImg.__orig||picImg;
  const W=cropSrc.naturalWidth,H=cropSrc.naturalHeight;
  crop=Object.assign({},picImg.__crop||{x:0,y:0,w:W,h:H});
  const cv=$("cropCv");
  ck=Math.min(Math.min(window.innerWidth-32,640)/W,(window.innerHeight*.5)/H);
  cv.width=Math.max(1,Math.round(W*ck));cv.height=Math.max(1,Math.round(H*ck));
  $("cropScale").value=PIC.scale;$("cropScaleOut").textContent=PIC.scale+"%";
  $("cropModal").hidden=false;drawCrop();
}
function drawCrop(){
  const cv=$("cropCv"),c=cv.getContext("2d");
  c.clearRect(0,0,cv.width,cv.height);c.drawImage(cropSrc,0,0,cv.width,cv.height);
  const x=crop.x*ck,y=crop.y*ck,w=crop.w*ck,h=crop.h*ck;
  c.fillStyle="rgba(0,0,0,.55)";
  c.fillRect(0,0,cv.width,y);c.fillRect(0,y+h,cv.width,cv.height-y-h);c.fillRect(0,y,x,h);c.fillRect(x+w,y,cv.width-x-w,h);
  c.strokeStyle="#ffffff";c.lineWidth=2;c.strokeRect(x+1,y+1,Math.max(0,w-2),Math.max(0,h-2));
  c.fillStyle="#ffffff";[[x,y],[x+w,y],[x,y+h],[x+w,y+h]].forEach(([px,py])=>c.fillRect(px-8,py-8,16,16));
}
function cpos(e){const cv=$("cropCv"),r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)*(cv.width/r.width)/ck,y:(e.clientY-r.top)*(cv.height/r.height)/ck}}
const clampN=(v,a,b)=>Math.max(a,Math.min(b,v));
$("cropCv").addEventListener("pointerdown",e=>{
  const p=cpos(e),tol=28/ck;
  const cs=[[crop.x,crop.y,crop.x+crop.w,crop.y+crop.h],[crop.x+crop.w,crop.y,crop.x,crop.y+crop.h],[crop.x,crop.y+crop.h,crop.x+crop.w,crop.y],[crop.x+crop.w,crop.y+crop.h,crop.x,crop.y]];
  let best=null,bd=tol;
  cs.forEach(q=>{const d=Math.hypot(p.x-q[0],p.y-q[1]);if(d<bd){bd=d;best=q}});
  if(best)cdrag={t:"corner",ox:best[2],oy:best[3]};
  else if(p.x>=crop.x&&p.x<=crop.x+crop.w&&p.y>=crop.y&&p.y<=crop.y+crop.h)cdrag={t:"move",dx:p.x-crop.x,dy:p.y-crop.y};
  else return;
  e.preventDefault();$("cropCv").setPointerCapture(e.pointerId);
});
$("cropCv").addEventListener("pointermove",e=>{
  if(!cdrag)return;
  const W=cropSrc.naturalWidth,H=cropSrc.naturalHeight,p=cpos(e),m=Math.max(4,24/ck);
  if(cdrag.t==="move"){crop.x=clampN(p.x-cdrag.dx,0,W-crop.w);crop.y=clampN(p.y-cdrag.dy,0,H-crop.h)}
  else{
    const px=clampN(p.x,0,W),py=clampN(p.y,0,H);
    let x1=Math.min(px,cdrag.ox),x2=Math.max(px,cdrag.ox),y1=Math.min(py,cdrag.oy),y2=Math.max(py,cdrag.oy);
    if(x2-x1<m){if(px<cdrag.ox)x1=cdrag.ox-m;else x2=cdrag.ox+m}
    if(y2-y1<m){if(py<cdrag.oy)y1=cdrag.oy-m;else y2=cdrag.oy+m}
    x1=clampN(x1,0,W);y1=clampN(y1,0,H);x2=clampN(x2,0,W);y2=clampN(y2,0,H);
    crop={x:x1,y:y1,w:x2-x1,h:y2-y1};
  }
  drawCrop();
});
["pointerup","pointercancel"].forEach(t=>$("cropCv").addEventListener(t,()=>{cdrag=null}));
$("cropScale").addEventListener("input",()=>{$("cropScaleOut").textContent=$("cropScale").value+"%"});

$("cropOk").onclick=()=>{

  const full=crop.x<=0&&crop.y<=0&&crop.w>=W-.5&&crop.h>=H-.5;
  const apply=im=>{picImg=im;$("pic").src=im.src;PIC.scale=scale;layoutPic();select("image");commit()};
  $("cropModal").hidden=true;
  if(full){apply(cropSrc);return}
  const r=Math.min(1,1600/Math.max(crop.w,crop.h)),out=document.createElement("canvas");
  out.width=Math.max(1,Math.round(crop.w*r));out.height=Math.max(1,Math.round(crop.h*r));
  out.getContext("2d").drawImage(cropSrc,crop.x,crop.y,crop.w,crop.h,0,0,out.width,out.height);
  const im=new Image();im.__orig=cropSrc;im.__crop=Object.assign({},crop);im.onload=()=>apply(im);im.src=out.toDataURL("image/png");
};

function useSand(){
  sand-=10;
  if(sand<=0){sand=100;toast("命の砂時計を使い切りました。同じ書き出しで、皆様の命の砂時計を無駄遣いさせてしまいました")}

function exportImage(){
  useSand();
  const cv=document.createElement("canvas");cv.width=1600;cv.height=900;
  renderSlide(cv.getContext("2d"),currentTexts(),true,L);
  $("outImg").src=cv.toDataURL("image/png");$("modal").hidden=false;

function renderSlide(c,texts,usePic,lay){
  lay.shapes(c);
  const pic=usePic&&picImg&&lay===L;
  if(pic){const [w,h]=picDims();c.drawImage(picImg,PIC.x-w/2,PIC.y-h/2,w,h)}
  lay.items.forEach(it=>{
    if(it.id===lay.markId&&pic)return;
    const ls=String(texts[it.id]||"").split("\n");if(!ls.join("").trim())return;
    c.font=`${it.font==="anton"?400:it.bold?900:500} ${it.size}px ${famOf(it)}`;c.textAlign="center";c.textBaseline="middle";
    const lh=it.size*1.2,top=it.y-(ls.length-1)*lh/2;
    if(it.pill){const w=Math.max(...ls.map(l=>c.measureText(l).width))+48,h=ls.length*lh+20;c.fillStyle=C.blue;c.fillRect(it.x-w/2,it.y-h/2,w,h)}
    ls.forEach((l,i)=>{
      const y=top+i*lh;
      if(it.cap){c.lineJoin="round";c.lineWidth=it.size*.2;c.strokeStyle="#000000";c.strokeText(l,it.x,y)}
      if(it.gold){
        c.lineJoin="round";c.lineWidth=(it.thin?1.5:Math.max(2,it.size*.035))*2;c.strokeStyle="#000000";c.strokeText(l,it.x,y);
        const gg=c.createLinearGradient(0,y-it.size*.5,0,y+it.size*.5);
        [[0,"#fff6c4"],[.38,"#f1cf5c"],[.52,"#a8770f"],[.7,"#e8c25a"],[1,"#fff0a8"]].forEach(([o,col])=>gg.addColorStop(o,col));
        c.fillStyle=gg;c.fillText(l,it.x,y);return;
      }
      c.fillStyle=it.color;c.fillText(l,it.x,y);
    });
  });
}

// 保存（このブラウザの中に保存）
const STORE="kaiken-maker-files";
function loadSaved(){try{return JSON.parse(localStorage.getItem(STORE)||"[]")}catch(e){return []}}
function writeSaved(a){localStorage.setItem(STORE,JSON.stringify(a))}
function nowStr(){const d=new Date(),z=n=>String(n).padStart(2,"0");return `${d.getFullYear()}/${z(d.getMonth()+1)}/${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`}
function setState(t){$("saveState").textContent=t}
function toast(msg){const t=$("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{t.hidden=true},2400)}
function saveFile(){
  flush();
  const name=$("fileName").value;
  const rec={name,layout:L.name,texts:currentTexts(),styles:styleSnap(),pic:picImg?{src:picImg.src,scale:PIC.scale}:null,when:nowStr()};
  const a=loadSaved().filter(f=>f.name!==name);a.unshift(rec);
  try{writeSaved(a)}catch(e){
    if(rec.pic){rec.pic=null;try{writeSaved(a);setState("保存済み");toast("画像が大きいため、画像を除いて保存しました");return}catch(e2){}}
    toast("保存できませんでした。ブラウザの保存できる容量がいっぱいか、保存が使えない設定です");return;
  }
  setState("保存済み");toast("「"+name+"」を保存しました");
}
function openSaved(rec){
  flush();setLayout(rec.layout);
  Object.values(LAYOUTS).forEach(l=>l.items.forEach(it=>{const v=rec.styles&&rec.styles[it.id];if(v){it.size=v[0];it.bold=v[1];it.color=v[2];it.gold=v[3]}styleItem(it)}));
  fill(rec.texts);$("fileName").value=rec.name;closeBackstage();
  const done=()=>{commit();setState("保存済み")};
  if(rec.pic){const im=new Image();im.onload=()=>{picImg=im;$("pic").src=im.src;PIC.scale=rec.pic.scale;layoutPic();done()};im.onerror=done;im.src=rec.pic.src}else done();
}
function renderSaved(){
  const saved=loadSaved(),sl=$("savedList");sl.innerHTML="";$("savedHead").hidden=!saved.length;
  saved.forEach(f=>{
    const row=document.createElement("div");row.className="bs-row";
    const b=document.createElement("button");b.type="button";b.className="bs-file";
    const cv=document.createElement("canvas");cv.width=320;cv.height=180;
    const t=document.createElement("span");t.className="tt";
    const nm=document.createElement("span");nm.className="nm";nm.textContent=f.name;
    const mt=document.createElement("span");mt.className="meta";mt.textContent="このブラウザ　"+f.when;
    t.append(nm,mt);b.append(cv,t);b.onclick=()=>openSaved(f);
    const del=document.createElement("button");del.type="button";del.className="bs-del";del.textContent="削除";
    del.onclick=()=>{
      if(!del.classList.contains("armed")){del.classList.add("armed");del.textContent="本当に削除";setTimeout(()=>{del.classList.remove("armed");del.textContent="削除"},3000);return}
      try{writeSaved(loadSaved().filter(x=>x.name!==f.name))}catch(e){}
      renderSaved();toast("「"+f.name+"」を削除しました");
    };
    row.append(b,del);sl.appendChild(row);
    try{thumb(cv,f.texts,f.layout)}catch(e){}
  });
}

// 元に戻す・やり直す
const hist=[];let hi=-1,restoring=false;
function styleSnap(){const o={};Object.values(LAYOUTS).forEach(l=>l.items.forEach(it=>o[it.id]=[it.size,it.bold,it.color,!!it.gold]));return o}
function snap(){return {layout:L.name,texts:currentTexts(),styles:styleSnap(),pic:picImg?{img:picImg,scale:PIC.scale}:null,file:$("fileName").value}}
function same(a,b){return a&&b&&a.layout===b.layout&&a.file===b.file&&JSON.stringify([a.texts,a.styles])===JSON.stringify([b.texts,b.styles])&&(a.pic?a.pic.img:null)===(b.pic?b.pic.img:null)&&(a.pic?a.pic.scale:0)===(b.pic?b.pic.scale:0)}
function updUndo(){$("undoBtn").disabled=hi<=0;$("redoBtn").disabled=hi>=hist.length-1}
function commit(){
  if(restoring)return;clearTimeout(typingT);typingT=null;
  const sn=snap();if(same(hist[hi],sn))return;
  hist.splice(hi+1);hist.push(sn);if(hist.length>100)hist.shift();hi=hist.length-1;updUndo();setState("未保存");
}
function flush(){if(typingT)commit()}
function restore(sn){
  restoring=true;
  if(L.name!==sn.layout)setLayout(sn.layout);
  Object.values(LAYOUTS).forEach(l=>l.items.forEach(it=>{const v=sn.styles[it.id];it.size=v[0];it.bold=v[1];it.color=v[2];it.gold=v[3];styleItem(it)}));
  fill(sn.texts);
  if(sn.pic){picImg=sn.pic.img;PIC.scale=sn.pic.scale;$("pic").src=picImg.src}else picImg=null;
  layoutPic();unselect();$("fileName").value=sn.file;
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  restoring=false;updUndo();setState("未保存");
}
function undo(){flush();if(hi>0){hi--;restore(hist[hi])}}
function redo(){flush();if(hi<hist.length-1){hi++;restore(hist[hi])}}
$("undoBtn").addEventListener("mousedown",e=>e.preventDefault());
$("redoBtn").addEventListener("mousedown",e=>e.preventDefault());
$("undoBtn").onclick=undo;$("redoBtn").onclick=redo;
// ファイル名の変更
$("fileName").addEventListener("focus",e=>e.target.select());
$("fileName").addEventListener("keydown",e=>{if(e.key==="Enter")e.target.blur()});
$("fileName").addEventListener("change",e=>{
  let v=e.target.value.trim();if(!v)v="プレゼンテーション1";
  if(!/\.pptx$/i.test(v))v+=".pptx";
  e.target.value=v;commit();
});
document.addEventListener("keydown",e=>{
  if(!(e.ctrlKey||e.metaKey))return;const k=e.key.toLowerCase();
  if(k==="s"){e.preventDefault();saveFile();return}
  if(k==="z"&&!e.shiftKey){e.preventDefault();undo()}
  else if(k==="y"||(k==="z"&&e.shiftKey)){e.preventDefault();redo()}
});

Object.values(LAYOUTS).forEach(l=>l.items.forEach(styleItem));

}
